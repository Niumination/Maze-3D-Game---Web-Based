<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D Maze Ultimate</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;touch-action:none}
  canvas{display:block}
  #c{position:fixed;top:0;left:0;width:100%;height:100%}
  #ui{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:10}
  #topbar{position:absolute;top:1.5vh;left:2vw;right:2vw;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
  #timer{font-size:clamp(12px,3.2vw,18px);color:#fff;text-shadow:0 0 3px #000;font-weight:600;background:rgba(0,0,0,0.4);padding:0.6vh 1.8vw;border-radius:1vw}
  #level{font-size:clamp(11px,2.6vw,16px);color:#0f0;text-shadow:0 0 2px #000;background:rgba(0,0,0,0.4);padding:0.5vh 1.5vw;border-radius:1vw}
  #leftPanel{position:absolute;left:2vw;top:8vh;pointer-events:none}
  #map{width:clamp(80px,16vmin,120px);height:clamp(80px,16vmin,120px);background:rgba(0,0,0,0.55);border:1.5px solid rgba(255,255,255,0.7);border-radius:1.2vw;display:block}
  #rightPanel{position:absolute;right:2vw;top:8vh;display:flex;flex-direction:column;gap:1.2vh;pointer-events:auto}
  #rightPanel button{width:clamp(36px,7.5vw,48px);height:clamp(36px,7.5vw,48px);font-size:clamp(16px,3.5vw,20px);background:rgba(0,0,0,0.55);color:#fff;border:1.2px solid rgba(255,255,255,0.7);border-radius:50%;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:0}
  #rightPanel button:active{transform:scale(0.92)}
  #leftZone,#rightZone{position:fixed;top:0;bottom:0;width:50vw;z-index:5}
  #leftZone{left:0} #rightZone{right:0}
  #joy{position:absolute;width:14vw;height:14vw;max-width:70px;max-height:70px;border:1.5px solid rgba(255,255,255,0.25);border-radius:50%;left:12vw;bottom:12vw;display:none;pointer-events:none}
  #joy::after{content:'';position:absolute;width:6vw;height:6vw;max-width:30px;max-height:30px;background:rgba(255,255,255,0.4);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
  #win{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:20;text-align:center;padding:5vw}
  #win h1{font-size:clamp(28px,7vw,42px);margin:0} #win p{font-size:clamp(14px,3.8vw,20px);margin:1.2vh} #win button{font-size:clamp(14px,4vw,18px);padding:1.8vh 5vw;margin-top:2vh;background:#0f0;color:#000;border:none;border-radius:1.5vw;font-weight:700}
  #board{font-size:clamp(11px,3vw,15px);opacity:0.85;margin-top:1.5vh;white-space:pre-line;line-height:1.4}
  #crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;border:1.5px solid rgba(255,255,255,0.5);border-radius:50%;pointer-events:none;z-index:15;display:none}
  #controlsHint{position:fixed;bottom:2vh;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.6);font-size:clamp(10px,2.5vw,13px);text-align:center;pointer-events:none;z-index:15;background:rgba(0,0,0,0.4);padding:0.5vh 2vw;border-radius:1vw;display:none}
  #pauseOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:25;color:#fff}
  #pauseOverlay h2{font-size:clamp(24px,6vw,36px);margin:0 0 2vh}
  #pauseOverlay button{font-size:clamp(14px,3.5vw,18px);padding:1.2vh 4vw;margin:0.8vh;background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:1vw;cursor:pointer;min-width:200px}
  #pauseOverlay button:hover{background:rgba(255,255,255,0.25)}
  #pauseOverlay button.mod-cta{background:#0f0;color:#000;border-color:#0f0;font-weight:700}
  #mainMenu{position:fixed;inset:0;background:linear-gradient(135deg,#0a0a1a 0%,#1a0a2a 50%,#0a1a2a 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:30;color:#fff;text-align:center;padding:5vw}
  #mainMenu h1{font-size:clamp(32px,8vw,56px);margin:0 0 1vh;background:linear-gradient(90deg,#0f0,#0af,#f0a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none}
  #mainMenu .subtitle{font-size:clamp(12px,3vw,16px);opacity:0.7;margin-bottom:4vh}
  #mainMenu button{font-size:clamp(16px,4vw,20px);padding:1.5vh 6vw;margin:0.8vh;background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:1.5vw;cursor:pointer;min-width:250px;transition:all 0.2s}
  #mainMenu button:hover{background:rgba(255,255,255,0.2);transform:scale(1.05)}
  #mainMenu button.mod-cta{background:linear-gradient(90deg,#0f0,#0a0);color:#000;border-color:#0f0;font-weight:700}
  #mainMenu .bestTimes{font-size:clamp(11px,2.5vw,14px);opacity:0.6;margin-top:3vh;white-space:pre-line}
  #mainMenu .controls{font-size:clamp(10px,2.2vw,12px);opacity:0.4;margin-top:2vh}
  #hud{position:fixed;bottom:2vh;left:2vw;pointer-events:none;z-index:15;color:#fff;font-size:clamp(11px,2.5vw,14px);display:none}
  #hud .item{background:rgba(0,0,0,0.5);padding:0.4vh 1.2vw;border-radius:0.8vw;margin:0.3vh 0;display:inline-block;margin-right:1vw}
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="topbar">
    <div id="timer">00:00</div>
    <div id="level">Level 1</div>
  </div>
  <div id="leftPanel">
    <canvas id="map" width="128" height="128"></canvas>
  </div>
  <div id="rightPanel">
    <button id="restart" title="Restart">🔄</button>
    <button id="flash" title="Senter">🔦</button>
    <button id="music" title="Musik">🎵</button>
    <button id="skin" title="Tema Dinding">🎨</button>
    <button id="scale" title="Zoom">🔍</button>
  </div>
</div>
<div id="leftZone"><div id="joy"></div></div>
<div id="rightZone"></div>
<div id="crosshair"></div>
<div id="controlsHint"></div>
<div id="hud">
  <span class="item" id="hudKey">🔑 0</span>
  <span class="item" id="hudShield" style="display:none">🛡️</span>
  <span class="item" id="hudSpeed" style="display:none">⚡</span>
  <span class="item" id="hudCompass" style="display:none">🧭 ON</span>
</div>
<div id="win">
  <h1>SELESAI!</h1>
  <p id="finalTime"></p>
  <p id="nextInfo"></p>
  <div id="board"></div>
  <button id="again">Lanjut</button>
</div>
<div id="pauseOverlay">
  <h2>⏸ PAUSE</h2>
  <button id="resumeBtn" class="mod-cta">▶ Resume</button>
  <button id="pauseRestart">🔄 Restart</button>
  <button id="pauseMenu">🏠 Main Menu</button>
</div>
<div id="mainMenu">
  <h1>3D MAZE ULTIMATE</h1>
  <p class="subtitle">Temukan jalan keluar dari labirin misterius!</p>
  <button id="menuPlay" class="mod-cta">▶ MAIN</button>
  <button id="menuBest">🏆 Waktu Terbaik</button>
  <button id="menuHelp">❓ Cara Main</button>
  <div id="menuBestTimes" class="bestTimes" style="display:none"></div>
  <div id="menuHelpText" class="bestTimes" style="display:none"></div>
  <p class="controls" id="menuControls"></p>
</div>

<script type="module">
import * as THREE from 'three';

const LEVELS = [
  {size:11, name:'Mudah'},
  {size:15, name:'Sedang'},
  {size:19, name:'Sulit'},
  {size:23, name:'Ekstrem'}
];
const THEMES = [
  {name:'Hutan', type:'forest'},
  {name:'Kota', type:'city'},
  {name:'Dungeon', type:'stone'},
  {name:'Neon', type:'neon'},
  {name:'Gurun', type:'sand'}
];
let themeIdx = 0;
const SCALES = [60,70,80,90,100];
let scaleIdx = 2;
let currentLevel = parseInt(localStorage.getItem('mazeLevel')||'0');

let scene, camera, renderer, walls=[], wallInstanced, goalMesh, flashlight, hemi, dirLight;
let movingObs=[], holes=[];
let powerups=[], keyCount=0, hasShield=false, speedBoostEnd=0, compassOn=false;
let clock = new THREE.Clock();
let startTime=0, paused=false, finished=false;
const cellSize=2;
let grid, startPos, endPos, mazeSize;
let move={x:0,y:0}, rotDelta=0, leftId=null, rightId=null, lastTouch=0;
const joy=document.getElementById('joy');
const mapCtx=document.getElementById('map').getContext('2d');

// PLATFORM DETECTION
const isDesktop = !('ontouchstart' in window) || navigator.maxTouchPoints === 0;
const crosshair = document.getElementById('crosshair');
const controlsHint = document.getElementById('controlsHint');
let pointerLocked = false;

// GAME STATE
let gameState = 'menu'; // 'menu', 'playing', 'paused', 'win'

// KEYBOARD STATE
const keys = {};

// AUDIO
let audioCtx, musicOn=false, musicNodes=[];
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function beep(f=440,d=0.05,v=0.05){initAudio(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='square'; o.frequency.value=f; g.gain.value=v; o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d);}
function winSound(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.12,0.08),i*120));}
function toggleMusic(){
  initAudio(); musicOn=!musicOn;
  document.getElementById('music').style.opacity = musicOn?1:0.5;
  if(musicOn){
    const seq=[330,0,392,0,440,0,523,0]; let step=0;
    const play=()=>{ if(!musicOn) return; const f=seq[step%seq.length]; if(f) beep(f,0.1,0.03); step++; setTimeout(play,220); };
    play();
  }
}

// KEYBOARD & MOUSE CONTROLS (DESKTOP)
function handleKeyboardControls(){
  if(!isDesktop) return;

  // Show desktop hints
  crosshair.style.display = 'block';
  controlsHint.style.display = 'block';
  controlsHint.textContent = 'WASD = Move | Mouse = Look | Click = Lock | ESC = Pause | R=Restart F=Flashlight M=Music';

  // Keyboard input
  document.addEventListener('keydown', (e) => {
    if(gameState === 'menu' || gameState === 'win') return;
    keys[e.code] = true;

    // ESC = pause
    if(e.code === 'Escape'){
      if(pointerLocked){
        document.exitPointerLock();
      } else {
        togglePause();
      }
      return;
    }

    // Keyboard shortcuts (only when playing)
    if(gameState === 'playing'){
      if(e.code === 'KeyR') { beep(200); loadLevel(); }
      if(e.code === 'KeyF') toggleFlash();
      if(e.code === 'KeyM') toggleMusic();
      if(e.code === 'KeyT') changeTheme();
      if(e.code === 'Equal' || e.code === 'NumpadAdd') changeScale();
    }
  });

  document.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  // Pointer Lock for mouse look
  const canvas = document.getElementById('c');
  canvas.addEventListener('click', () => {
    if(!paused && !finished && !pointerLocked){
      canvas.requestPointerLock();
    }
  });

  document.addEventListener('pointerlockchange', () => {
    pointerLocked = document.pointerLockElement === canvas;
    crosshair.style.opacity = pointerLocked ? 1 : 0.3;
  });

  document.addEventListener('mousemove', (e) => {
    if(pointerLocked && !paused && !finished){
      rotDelta += e.movementX * 0.3;
    }
  });
}

// PAUSE SYSTEM
function togglePause(){
  if(gameState === 'win') return;
  paused = !paused;
  gameState = paused ? 'paused' : 'playing';
  const overlay = document.getElementById('pauseOverlay');
  if(paused){
    overlay.style.display = 'flex';
    if(pointerLocked) document.exitPointerLock();
  } else {
    overlay.style.display = 'none';
    startTime = performance.now() - (elapsed * 1000);
  }
}

let elapsed = 0;


function createWallTexture(theme){
  const c=document.createElement('canvas'); c.width=256; c.height=256; const ctx=c.getContext('2d');
  if(theme==='forest'){
    ctx.fillStyle='#3a5f2b'; ctx.fillRect(0,0,256,256);
    ctx.strokeStyle='#2d4a22'; ctx.lineWidth=4;
    for(let i=0;i<12;i++){ ctx.beginPath(); ctx.moveTo(0,i*22); ctx.lineTo(256,i*22+10); ctx.stroke(); }
    ctx.fillStyle='#5a7f3b'; for(let i=0;i<80;i++){ ctx.fillRect(Math.random()*256,Math.random()*256,3,8); }
  } else if(theme==='city'){
    ctx.fillStyle='#6a6e73'; ctx.fillRect(0,0,256,256);
    ctx.fillStyle='#4a4e53'; for(let y=0;y<256;y+=32){ for(let x=0;x<256;x+=32){ ctx.fillRect(x+4,y+4,24,24); ctx.fillStyle='#2a2e33'; ctx.fillRect(x+8,y+8,6,8); ctx.fillRect(x+18,y+8,6,8); ctx.fillStyle='#4a4e53'; } }
    ctx.strokeStyle='#3a3e43'; ctx.lineWidth=2; ctx.strokeRect(0,0,256,256);
  } else if(theme==='stone'){
    ctx.fillStyle='#5a5a5a'; ctx.fillRect(0,0,256,256);
    for(let i=0;i<200;i++){ const g=60+Math.random()*40; ctx.fillStyle=`rgb(${g},${g},${g})`; ctx.fillRect(Math.random()*256,Math.random()*256,Math.random()*30,Math.random()*20); }
    ctx.strokeStyle='#3a3a3a'; for(let i=0;i<8;i++){ ctx.beginPath(); ctx.moveTo(0,Math.random()*256); ctx.lineTo(256,Math.random()*256); ctx.stroke(); }
  } else if(theme==='neon'){
    ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,256,256);
    ctx.strokeStyle='#4a5af9'; ctx.lineWidth=3; ctx.shadowColor='#4a5af9'; ctx.shadowBlur=10;
    for(let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(0,i*43); ctx.lineTo(256,i*43); ctx.stroke(); ctx.beginPath(); ctx.moveTo(i*43,0); ctx.lineTo(i*43,256); ctx.stroke(); }
  } else { // sand
    ctx.fillStyle='#c2a87a'; ctx.fillRect(0,0,256,256);
    for(let i=0;i<300;i++){ ctx.fillStyle=`rgba(${180+Math.random()*40},${150+Math.random()*30},${90+Math.random()*20},0.6)`; ctx.fillRect(Math.random()*256,Math.random()*256,2,2); }
  }
  const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(1,1); return tex;
}

function init(){
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x050508); scene.fog=new THREE.Fog(0x050508,8,22);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,100);
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:false,powerPreference:'low-power'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5)); renderer.setSize(window.innerWidth, window.innerHeight);

  hemi=new THREE.HemisphereLight(0xffffff,0x111122,0.9); scene.add(hemi);
  dirLight=new THREE.DirectionalLight(0xffffff,0.4); dirLight.position.set(5,8,3); scene.add(dirLight);
  flashlight=new THREE.SpotLight(0xffffff,0,18,Math.PI/4.5,0.6,1.5); 
  flashlight.position.set(0,-0.05,0.1); 
  flashlight.target = new THREE.Object3D();
  flashlight.target.position.set(0,0,-1);
  camera.add(flashlight);
  camera.add(flashlight.target);
  scene.add(camera);
  camera.fov=SCALES[scaleIdx]; camera.updateProjectionMatrix();

  handleControls(); handleKeyboardControls(); setupMainMenu();
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden && gameState==='playing'){ paused=true; }
  });
  function onResize(){
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  onResize();
  document.getElementById('restart').onclick=()=>{beep(200); loadLevel();};
  document.getElementById('again').onclick=nextLevel;
  document.getElementById('flash').onclick=toggleFlash;
  document.getElementById('music').onclick=toggleMusic;
  document.getElementById('skin').onclick=changeTheme;
  document.getElementById('scale').onclick=changeScale;

  // Pause menu buttons
  document.getElementById('resumeBtn').onclick = () => togglePause();
  document.getElementById('pauseRestart').onclick = () => { beep(200); loadLevel(); togglePause(); };
  document.getElementById('pauseMenu').onclick = () => { showMainMenu(); };

  // Start game loop (will skip if paused/menu)
  gameLoop();
}

// MAIN MENU SYSTEM
function setupMainMenu(){
  const menu = document.getElementById('mainMenu');
  const playBtn = document.getElementById('menuPlay');
  const bestBtn = document.getElementById('menuBest');
  const helpBtn = document.getElementById('menuHelp');
  const bestTimes = document.getElementById('menuBestTimes');
  const helpText = document.getElementById('menuHelpText');
  const controlsText = document.getElementById('menuControls');

  // Show controls hint based on platform
  if(isDesktop){
    controlsText.textContent = 'Desktop: WASD + Mouse | Mobile: Touch Controls';
  } else {
    controlsText.textContent = 'Mobile: Left Joystick = Move | Right Swipe = Look';
  }

  playBtn.onclick = () => {
    menu.style.display = 'none';
    gameState = 'playing';
    loadLevel();
    startTime = performance.now();
  };

  bestBtn.onclick = () => {
    const data = JSON.parse(localStorage.getItem('mazeBest')||'{}');
    let txt = '🏆 Waktu Terbaik:\n';
    let hasData = false;
    LEVELS.forEach(l => {
      if(data[l.name]){
        const s = data[l.name];
        txt += `${l.name}: ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}\n`;
        hasData = true;
      }
    });
    if(!hasData) txt += 'Belum ada catatan waktu.\nMainkan game dulu!';
    bestTimes.textContent = txt;
    bestTimes.style.display = bestTimes.style.display === 'none' ? 'block' : 'none';
    helpText.style.display = 'none';
  };

  helpBtn.onclick = () => {
    const txt = `🎮 Cara Main:\n\n` +
      `🎯 Tujuan: Temukan kotak hijau (exit)\n` +
      `⚠️ Hindari: Kotak merah (patroli) & lubang hitam\n` +
      `🔦 Senter: Tekan F untuk mode gelap\n` +
      `🎨 Tema: Tekan T untuk ganti tema dinding\n` +
      `⏸ Pause: Tekan ESC\n\n` +
      (isDesktop ? `🖥️ Desktop:\nWASD = Gerak | Mouse = Lihat\nKlik = Lock Mouse` : `📱 Mobile:\nKiri = Joystick Gerak\nKanan = Swipe untuk Lihat`);
    helpText.textContent = txt;
    helpText.style.display = helpText.style.display === 'none' ? 'block' : 'none';
    bestTimes.style.display = 'none';
  };
}

function showMainMenu(){
  gameState = 'menu';
  paused = false;
  document.getElementById('mainMenu').style.display = 'flex';
  document.getElementById('pauseOverlay').style.display = 'none';
  if(pointerLocked) document.exitPointerLock();
}

let flashOn=false;
function toggleFlash(){
  flashOn=!flashOn; beep(flashOn?800:400);
  document.getElementById('flash').style.opacity=flashOn?1:0.5;
  if(flashOn){ hemi.intensity=0.2; dirLight.intensity=0.05; flashlight.intensity=2.5; scene.fog.near=2; scene.fog.far=9; scene.background.set(0x000000); }
  else { hemi.intensity=0.9; dirLight.intensity=0.4; flashlight.intensity=0; scene.fog.near=8; scene.fog.far=22; scene.background.set(0x050508); }
}
function changeTheme(){ themeIdx=(themeIdx+1)%THEMES.length; const t=THEMES[themeIdx]; if(wallInstanced){ const tex=createWallTexture(t.type); wallInstanced.material.map=tex; wallInstanced.material.needsUpdate=true; } beep(600+themeIdx*40); localStorage.setItem('mazeTheme',themeIdx); showToast(t.name); }
function showToast(txt){ const el=document.getElementById('level'); const old=el.textContent; el.textContent='Tema: '+txt; el.style.color='#ff0'; setTimeout(()=>{el.textContent=old; el.style.color='#0f0';},900); }
function changeScale(){ scaleIdx=(scaleIdx+1)%SCALES.length; camera.fov=SCALES[scaleIdx]; camera.updateProjectionMatrix(); beep(400+scaleIdx*80); localStorage.setItem('mazeScale',scaleIdx); document.getElementById('scale').textContent=['🔍','🔎','👁️','👀','🔭'][scaleIdx]; }

function loadLevel(){
  walls.forEach(w=>scene.remove(w)); walls=[]; if(wallInstanced) scene.remove(wallInstanced); if(goalMesh) scene.remove(goalMesh);
  mazeSize=LEVELS[currentLevel].size;
  document.getElementById('level').textContent=`Level ${currentLevel+1} - ${LEVELS[currentLevel].name}`;
  const data=generateMaze(mazeSize); grid=data.grid; startPos=data.start; endPos=data.end;
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(mazeSize*cellSize,mazeSize*cellSize), new THREE.MeshLambertMaterial({color:0x101025})); floor.rotation.x=-Math.PI/2; scene.add(floor);
  // RINTANGAN LANTAI
  const obstacleGeo=new THREE.BoxGeometry(0.6,0.25,0.6);
  const obstacleMat=new THREE.MeshLambertMaterial({color:0x222222});
  let obsCount=0;
  for(let z=1;z<mazeSize-1;z++) for(let x=1;x<mazeSize-1;x++){
    if(grid[z][x]===0 && !(x===startPos.x&&z===startPos.z) && !(x===endPos.x&&z===endPos.z) && Math.random()<0.08 && obsCount<Math.floor(mazeSize*1.5)){
      const obs=new THREE.Mesh(obstacleGeo, obstacleMat);
      obs.position.set(x*cellSize,0.125,z*cellSize);
      scene.add(obs); walls.push(obs); obsCount++;
    }
  }
  // RINTANGAN BERGERAK PATROLI
  movingObs=[]; 
  const enemyCount = Math.min(2+currentLevel, 5);
  const detectRadius = [5, 7, 9, 11][currentLevel] || 5;
  const patrolMat=new THREE.MeshLambertMaterial({color:0xff3333, emissive:0x440000});
  const chaseMat=new THREE.MeshLambertMaterial({color:0xff0000, emissive:0xff0000, emissiveIntensity:0.5});
  for(let i=0;i<enemyCount;i++){
    let tries=0; while(tries<50){
      const x=2+Math.floor(Math.random()*(mazeSize-4));
      const z=2+Math.floor(Math.random()*(mazeSize-4));
      if(grid[z][x]===0 && grid[z][x+1]===0 && Math.hypot(x-startPos.x,z-startPos.z)>3){
        const mob=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.5,0.8), patrolMat.clone());
        mob.position.set(x*cellSize,0.25,z*cellSize);
        const px=Math.floor(startPos.x), pz=Math.floor(startPos.z);
        const path = findPath(x,z,px,pz);
        mob.userData={
          state:'patrol', // patrol, chase, search
          ax:x*cellSize, az:z*cellSize, bx:(x+1)*cellSize, bz:z*cellSize, t:Math.random(), dir:1,
          path:path, pathIdx:0, pathTimer:0,
          detectRadius:detectRadius, speed:0.8+currentLevel*0.15,
          lastPlayerX:0, lastPlayerZ:0, searchTimer:0
        };
        scene.add(mob); walls.push(mob); movingObs.push(mob); break;
      }
      tries++;
    }
  }
  // LUBANG JATUH
  holes=[];
  const holeMat=new THREE.MeshBasicMaterial({color:0x000000});
  for(let i=0;i<Math.floor(mazeSize/3);i++){
    let tries=0; while(tries<30){
      const x=2+Math.floor(Math.random()*(mazeSize-4));
      const z=2+Math.floor(Math.random()*(mazeSize-4));
      if(grid[z][x]===0 && !(x===startPos.x&&z===startPos.z) && Math.hypot(x-endPos.x,z-endPos.z)>3){
        const hole=new THREE.Mesh(new THREE.CircleGeometry(0.7,16), holeMat);
        hole.rotation.x=-Math.PI/2; hole.position.set(x*cellSize,0.02,z*cellSize);
        scene.add(hole); holes.push(hole); break;
      }
      tries++;
    }
  }

  // POWER-UPS
  powerups=[]; keyCount=0; hasShield=false; speedBoostEnd=0;
  const puTypes = ['key','speed','shield','compass'];
  const puColors = {key:0xffd700, speed:0x00bfff, shield:0xc0c0c0, compass:0xff69b4};
  const puEmojis = {key:'🔑', speed:'⚡', shield:'🛡️', compass:'🧭'};
  const puCount = Math.max(3, Math.floor(mazeSize/4));
  for(let i=0;i<puCount;i++){
    let tries=0; while(tries<50){
      const x=2+Math.floor(Math.random()*(mazeSize-4));
      const z=2+Math.floor(Math.random()*(mazeSize-4));
      if(grid[z][x]===0 && !(x===startPos.x&&z===startPos.z) && !(x===endPos.x&&z===endPos.z)){
        const type = i===0 ? 'key' : puTypes[Math.floor(Math.random()*puTypes.length)];
        const geo = type==='key' ? new THREE.OctahedronGeometry(0.35) : new THREE.SphereGeometry(0.3,8,8);
        const mat = new THREE.MeshLambertMaterial({color:puColors[type], emissive:puColors[type], emissiveIntensity:0.3});
        const pu = new THREE.Mesh(geo, mat);
        pu.position.set(x*cellSize, 0.5, z*cellSize);
        pu.userData = {type, emoji:puEmojis[type], baseY:0.5};
        scene.add(pu); powerups.push(pu); break;
      }
      tries++;
    }
  }

  const wallPos=[]; for(let z=0;z<mazeSize;z++) for(let x=0;x<mazeSize;x++) if(grid[z][x]) wallPos.push([x,z]);
  const geo=new THREE.BoxGeometry(cellSize,1.4,cellSize); const t=THEMES[themeIdx]; const tex=createWallTexture(t.type); const mat=new THREE.MeshLambertMaterial({map:tex});
  wallInstanced=new THREE.InstancedMesh(geo,mat,wallPos.length); const dummy=new THREE.Object3D();
  wallPos.forEach((p,i)=>{ dummy.position.set(p[0]*cellSize,0.7,p[1]*cellSize); dummy.updateMatrix(); wallInstanced.setMatrixAt(i,dummy.matrix); const w=new THREE.Mesh(new THREE.BoxGeometry(cellSize,1.4,cellSize)); w.position.copy(dummy.position); w.visible=false; walls.push(w); scene.add(w); });
  scene.add(wallInstanced);
  goalMesh=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9), new THREE.MeshLambertMaterial({color:0x00ff88,emissive:0x00aa55})); goalMesh.position.set(endPos.x*cellSize,0.45,endPos.z*cellSize); scene.add(goalMesh);
  camera.position.set(startPos.x*cellSize,0.8,startPos.z*cellSize);
  // langsung menghadap ke depan (arah +Z)
  camera.lookAt(startPos.x*cellSize, 0.8, startPos.z*cellSize + 2);
  finished=false; elapsed=0; gameState='playing'; startTime=performance.now(); document.getElementById('win').style.display='none'; document.getElementById('pauseOverlay').style.display='none'; document.getElementById('hud').style.display='none'; paused=false; drawMinimap();
  window._needKeyMsg = false; window._falling = false; window._hitCooldown = false;
  if(pointerLocked) document.exitPointerLock();
}

function generateMaze(size){ const g=Array(size).fill().map(()=>Array(size).fill(1)); function carve(x,z){ g[z][x]=0; const dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5); for(const [dx,dz] of dirs){ const nx=x+dx,nz=z+dz; if(nx>0&&nx<size-1&&nz>0&&nz<size-1&&g[nz][nx]===1){ g[z+dz/2][x+dx/2]=0; carve(nx,nz);} } } carve(1,1); return {grid:g,start:{x:1,z:1},end:{x:size-2,z:size-2}}; }

function handleControls(){
  const left=document.getElementById('leftZone'), right=document.getElementById('rightZone');
  const vib=()=>{if(navigator.vibrate)navigator.vibrate(8);};
  left.addEventListener('touchstart',e=>{initAudio();vib(); const t=e.changedTouches[0]; leftId=t.identifier; joy.style.display='block'; joy.style.left=(t.clientX-9*innerWidth/100)+'px'; joy.style.top=(t.clientY-9*innerWidth/100)+'px';},{passive:false});
  left.addEventListener('touchmove',e=>{ const now=performance.now(); if(now-lastTouch<20)return; lastTouch=now; for(const t of e.touches) if(t.identifier===leftId){ const dx=(t.clientX-parseFloat(joy.style.left)-9*innerWidth/100)/(9*innerWidth/100); const dy=(t.clientY-parseFloat(joy.style.top)-9*innerWidth/100)/(9*innerWidth/100); move.x=Math.max(-1,Math.min(1,dx)); move.y=Math.max(-1,Math.min(1,dy)); } },{passive:false});
  left.addEventListener('touchend',()=>{leftId=null;move.x=0;move.y=0;joy.style.display='none';});
  right.addEventListener('touchstart',e=>{vib(); rightId=e.changedTouches[0].identifier;},{passive:false});
  right.addEventListener('touchmove',e=>{ for(const t of e.touches) if(t.identifier===rightId){rotDelta=t.clientX-(right._lastX||t.clientX); right._lastX=t.clientX;} },{passive:false});
  right.addEventListener('touchend',()=>{rightId=null;rotDelta=0;right._lastX=null;});
}

function drawMinimap(){ const s=128/mazeSize; mapCtx.fillStyle='#000'; mapCtx.fillRect(0,0,128,128); for(let z=0;z<mazeSize;z++) for(let x=0;x<mazeSize;x++){ const themeColors={forest:'#3a5f2b',city:'#6a6e73',stone:'#5a5a5a',neon:'#4a5af9',sand:'#c2a87a'}; mapCtx.fillStyle=grid[z][x]?themeColors[THEMES[themeIdx].type]:'#111'; mapCtx.fillRect(x*s,z*s,s,s);} mapCtx.fillStyle='#00ff88'; mapCtx.fillRect(endPos.x*s,endPos.z*s,s,s); }

const ray=new THREE.Raycaster(); let stepTimer=0;
function gameLoop(){ requestAnimationFrame(gameLoop); if(gameState!=='playing'||finished) return; const delta=Math.min(clock.getDelta(),0.05);

  // KEYBOARD MOVEMENT (WASD)
  if(isDesktop){
    let kx=0, ky=0;
    if(keys['KeyW']||keys['ArrowUp']) ky=-1;
    if(keys['KeyS']||keys['ArrowDown']) ky=1;
    if(keys['KeyA']||keys['ArrowLeft']) kx=-1;
    if(keys['KeyD']||keys['ArrowRight']) kx=1;
    if(kx||ky){
      const len = Math.sqrt(kx*kx+ky*ky);
      move.x = kx/len;
      move.y = ky/len;
    } else if(!leftId) {
      move.x = 0;
      move.y = 0;
    }
  }

  camera.rotation.y += rotDelta*0.005; rotDelta *= 0.8; // swipe kanan = belok kanan
  if(move.x||move.y){ const fwd=new THREE.Vector3(move.x,0,move.y).normalize().applyQuaternion(camera.quaternion); fwd.y=0; ray.set(camera.position,fwd); ray.far=0.65; const hit=ray.intersectObjects(walls); if(!hit.length){ const speed = 2.2 * delta * getSpeedMultiplier(); camera.position.addScaledVector(fwd, speed); stepTimer+=delta; if(stepTimer>0.35){beep(300+Math.random()*50,0.02,0.02); stepTimer=0;} } else beep(150,0.03,0.03); }
  elapsed=Math.floor((performance.now()-startTime)/1000); document.getElementById('timer').textContent=`${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`;
  const px=camera.position.x/cellSize, pz=camera.position.z/cellSize; drawMinimap(); const s=128/mazeSize; mapCtx.fillStyle='#fff'; mapCtx.beginPath(); mapCtx.arc(px*s+s/2,pz*s+s/2,3,0,Math.PI*2); mapCtx.fill();
  if(camera.position.distanceTo(goalMesh.position)<1.1 && !finished){
    if(keyCount < 1){
      // Need key to exit
      if(!window._needKeyMsg){
        window._needKeyMsg = true;
        beep(200, 0.2, 0.08);
        showToast('🔑 Butuh 1 Key untuk keluar!');
        setTimeout(()=>{ window._needKeyMsg = false; }, 1500);
      }
      return;
    }
    finished=true; winSound(); if(navigator.vibrate)navigator.vibrate([40,30,40,30,80]); const timeStr=document.getElementById('timer').textContent; document.getElementById('finalTime').textContent=`Waktu: ${timeStr}`; saveBest(elapsed); document.getElementById('nextInfo').textContent=currentLevel<LEVELS.length-1?`Lanjut ke ${LEVELS[currentLevel+1].name}`:'Kamu tamatkan semua!'; document.getElementById('board').textContent=getBoardText(); document.getElementById('win').style.display='flex'; if(pointerLocked) document.exitPointerLock(); }
  // update patroli + AI
  const playerGridX = Math.round(camera.position.x/cellSize);
  const playerGridZ = Math.round(camera.position.z/cellSize);
  movingObs.forEach(m=>{
    const distToPlayer = Math.hypot(playerGridX-m.position.x/cellSize, playerGridZ-m.position.z/cellSize);
    const ud = m.userData;

    // STATE MACHINE
    if(ud.state==='patrol'){
      // Patrol linear
      ud.t += delta*0.6*ud.dir;
      if(ud.t>1){ud.t=1; ud.dir=-1;}
      if(ud.t<0){ud.t=0; ud.dir=1;}
      m.position.x = ud.ax*(1-ud.t) + ud.bx*ud.t;
      m.position.z = ud.az*(1-ud.t) + ud.bz*ud.t;
      // Check if player in range
      if(distToPlayer < ud.detectRadius){
        ud.state = 'chase';
        ud.path = findPath(Math.round(m.position.x/cellSize), Math.round(m.position.z/cellSize), playerGridX, playerGridZ);
        ud.pathIdx = 0;
        m.material.color.set(0xff0000);
        m.material.emissive.set(0xff0000);
        m.material.emissiveIntensity = 0.5;
      }
    } else if(ud.state==='chase'){
      // Follow A* path
      ud.pathTimer += delta;
      if(ud.pathTimer > 0.3){
        ud.pathTimer = 0;
        // Recalculate path every few frames
        ud.path = findPath(Math.round(m.position.x/cellSize), Math.round(m.position.z/cellSize), playerGridX, playerGridZ);
        ud.pathIdx = 0;
      }
      if(ud.path.length > 1 && ud.pathIdx < ud.path.length-1){
        ud.pathIdx++;
        const target = ud.path[ud.pathIdx];
        const tx = target[0]*cellSize, tz = target[1]*cellSize;
        const dx = tx-m.position.x, dz = tz-m.position.z;
        const dist = Math.sqrt(dx*dx+dz*dz);
        if(dist > 0.1){
          m.position.x += (dx/dist)*ud.speed*delta*cellSize;
          m.position.z += (dz/dist)*ud.speed*delta*cellSize;
        }
      }
      // Check if player escaped
      if(distToPlayer > ud.detectRadius * 1.5){
        ud.state = 'search';
        ud.lastPlayerX = playerGridX;
        ud.lastPlayerZ = playerGridZ;
        ud.searchTimer = 3;
        m.material.color.set(0xff6600);
        m.material.emissive.set(0xff6600);
      }
    } else if(ud.state==='search'){
      // Go to last known position
      ud.searchTimer -= delta;
      const dx = ud.lastPlayerX*cellSize - m.position.x;
      const dz = ud.lastPlayerZ*cellSize - m.position.z;
      const dist = Math.sqrt(dx*dx+dz*dz);
      if(dist > 0.5){
        m.position.x += (dx/dist)*ud.speed*0.7*delta*cellSize;
        m.position.z += (dz/dist)*ud.speed*0.7*delta*cellSize;
      }
      if(ud.searchTimer <= 0){
        ud.state = 'patrol';
        m.material.color.set(0xff3333);
        m.material.emissive.set(0x440000);
        m.material.emissiveIntensity = 0;
      }
    }
    m.rotation.y += delta*2;

    // ENEMY HIT PLAYER
    if(camera.position.distanceTo(m.position)<0.8){
      if(hasShield){
        hasShield = false;
        beep(600, 0.2, 0.08);
        showToast('🛡️ Shield menyerap serangan!');
        // Push enemy away
        m.position.x += (m.position.x-camera.position.x)*2;
        m.position.z += (m.position.z-camera.position.z)*2;
      } else if(!window._hitCooldown){
        window._hitCooldown = true;
        beep(150, 0.3, 0.1);
        if(navigator.vibrate) navigator.vibrate([100,50,100]);
        showToast('💥 Kena enemy! Kembali ke start');
        camera.position.set(startPos.x*cellSize,0.8,startPos.z*cellSize);
        camera.lookAt(startPos.x*cellSize,0.8,startPos.z*cellSize+2);
        setTimeout(()=>{ window._hitCooldown = false; }, 1000);
      }
    }
  });
  // cek lubang
  for(const h of holes){
    if(camera.position.distanceTo(h.position)<0.6){
      if(!window._falling){ window._falling=true; beep(120,0.3,0.1); if(navigator.vibrate) navigator.vibrate([100,50,100]); setTimeout(()=>{ camera.position.set(startPos.x*cellSize,0.8,startPos.z*cellSize); camera.lookAt(startPos.x*cellSize,0.8,startPos.z*cellSize+2); window._falling=false; },400); }
      break;
    }
  }
  // POWER-UP PICKUP
  for(let i=powerups.length-1;i>=0;i--){
    const pu = powerups[i];
    pu.rotation.y += delta*2;
    pu.position.y = pu.userData.baseY + Math.sin(performance.now()*0.004+i)*0.15;
    if(camera.position.distanceTo(pu.position)<1.0){
      beep(800+i*100, 0.1, 0.08);
      applyPowerUp(pu.userData.type);
      scene.remove(pu);
      powerups.splice(i,1);
    }
  }
  // SPEED BOOST EXPIRE
  if(speedBoostEnd > 0 && performance.now() > speedBoostEnd){
    speedBoostEnd = 0;
  }
  // UPDATE HUD
  const hud = document.getElementById('hud');
  hud.style.display = 'block';
  document.getElementById('hudKey').textContent = '🔑 '+keyCount;
  document.getElementById('hudShield').style.display = hasShield ? 'inline-block' : 'none';
  document.getElementById('hudSpeed').style.display = speedBoostEnd > 0 ? 'inline-block' : 'none';
  document.getElementById('hudCompass').style.display = compassOn ? 'inline-block' : 'none';
  goalMesh.rotation.y+=delta*1.5; goalMesh.position.y=0.45+Math.sin(performance.now()*0.003)*0.1; renderer.render(scene,camera);
}

function saveBest(sec){ const key='mazeBest'; const data=JSON.parse(localStorage.getItem(key)||'{}'); const lvl=LEVELS[currentLevel].name; if(!data[lvl]||sec<data[lvl]) data[lvl]=sec; localStorage.setItem(key,JSON.stringify(data)); localStorage.setItem('mazeLevel',currentLevel); }
function getBoardText(){ const data=JSON.parse(localStorage.getItem('mazeBest')||'{}'); let txt='🏆 Waktu Terbaik:\n'; LEVELS.forEach(l=>{ if(data[l.name]){ const s=data[l.name]; txt+=`${l.name}: ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}\n`; } }); return txt; }
function nextLevel(){ currentLevel=(currentLevel+1)%LEVELS.length; localStorage.setItem('mazeLevel',currentLevel); loadLevel(); }

// POWER-UP SYSTEM
function applyPowerUp(type){
  if(type==='key'){
    keyCount++;
    showToast('🔑 Key! ('+keyCount+')');
  } else if(type==='speed'){
    speedBoostEnd = performance.now() + 5000;
    showToast('⚡ Speed Boost! 5 detik');
  } else if(type==='shield'){
    hasShield = true;
    showToast('🛡️ Shield aktif!');
  } else if(type==='compass'){
    compassOn = !compassOn;
    showToast(compassOn ? '🧭 Compass ON' : '🧭 Compass OFF');
  }
}

function getSpeedMultiplier(){
  return speedBoostEnd > 0 ? 1.5 : 1.0;
}

// A* PATHFINDING
function findPath(sx,sz,ex,ez){
  const open=[], closed=new Set();
  open.push({x:sx,z:sz,g:0,h:Math.abs(sx-ex)+Math.abs(sz-ez),parent:null});
  while(open.length>0){
    open.sort((a,b)=>(a.g+a.h)-(b.g+b.h));
    const curr=open.shift();
    const key=curr.x+','+curr.z;
    if(curr.x===ex&&curr.z===ez){
      const path=[]; let n=curr;
      while(n){path.unshift([n.x,n.z]);n=n.parent;}
      return path;
    }
    if(closed.has(key)) continue;
    closed.add(key);
    for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=curr.x+dx, nz=curr.z+dz;
      const nkey=nx+','+nz;
      if(closed.has(nkey)) continue;
      if(nx<0||nx>=mazeSize||nz<0||nz>=mazeSize) continue;
      if(grid[nz][nx]===1) continue;
      open.push({x:nx,z:nz,g:curr.g+1,h:Math.abs(nx-ex)+Math.abs(nz-ez),parent:curr});
    }
  }
  return [];
}

themeIdx=parseInt(localStorage.getItem('mazeTheme')||'0');
scaleIdx=parseInt(localStorage.getItem('mazeScale')||'2');
document.getElementById('scale').textContent=['🔍','🔎','👁️','👀','🔭'][scaleIdx];
init();
</script>
