<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Maze 3D - Mobile Fix</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:sans-serif;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
#timer{position:absolute;left:10px;top:8px;background:#0008;color:#fff;padding:4px 8px;border-radius:6px;font-size:14px}
#level{position:absolute;right:10px;top:8px;background:#0008;color:#0f0;padding:4px 8px;border-radius:6px;font-size:14px}
#map{position:absolute;left:10px;top:40px;width:80px;height:80px;border:1px solid #fff;background:#000}
#btns{position:absolute;right:10px;top:40px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#btns button{width:42px;height:42px;border-radius:50%;border:1px solid #fff;background:#000a;color:#fff;font-size:18px}
#joy{position:absolute;width:56px;height:56px;border:2px solid #fff5;border-radius:50%;display:none;pointer-events:none}
#joy::after{content:'';position:absolute;left:18px;top:18px;width:20px;height:20px;background:#fffa;border-radius:50%}
#left,#right{position:fixed;top:0;bottom:0;width:50%;z-index:2}
#left{left:0} #right{right:0}
#err{position:fixed;inset:0;background:#200;color:#fff;display:none;align-items:center;justify-content:center;padding:20px;text-align:center;z-index:99}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<div id="ui">
  <div id="timer">00:00</div>
  <div id="level">Lv1</div>
  <canvas id="map" width="64" height="64"></canvas>
  <div id="btns">
    <button id="rst">↻</button>
    <button id="lit">🔦</button>
    <button id="thm">🎨</button>
  </div>
</div>
<div id="left"><div id="joy"></div></div>
<div id="right"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
<script>
try{
const T=THREE;
const canvas=document.getElementById('c');
const renderer=new T.WebGLRenderer({canvas,antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x202030);

const scene=new T.Scene();
const camera=new T.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2,1.2,2);

const light=new T.AmbientLight(0xffffff,1); scene.add(light);

// maze simple 11x11
const size=11, cs=2;
const grid=Array(size).fill().map(()=>Array(size).fill(1));
function carve(x,z){ grid[z][x]=0; [[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5).forEach(([dx,dz])=>{ const nx=x+dx,nz=z+dz; if(nx>0&&nx<size-1&&nz>0&&nz<size-1&&grid[nz][nx]){ grid[z+dz/2][x+dx/2]=0; carve(nx,nz);} });}
carve(1,1);

const mat=new T.MeshBasicMaterial({color:0x888888});
const floor=new T.Mesh(new T.PlaneGeometry(size*cs,size*cs), new T.MeshBasicMaterial({color:0x111122}));
floor.rotation.x=-Math.PI/2; scene.add(floor);

const walls=[];
for(let z=0;z<size;z++) for(let x=0;x<size;x++) if(grid[z][x]){
  const b=new T.Mesh(new T.BoxGeometry(cs,1.5,cs), mat);
  b.position.set(x*cs,0.75,z*cs); scene.add(b); walls.push(b);
}
const goal=new T.Mesh(new T.BoxGeometry(0.8,0.8), new T.MeshBasicMaterial({color:0x00ff88}));
goal.position.set((size-2)*cs,0.4,(size-2)*cs); scene.add(goal);

camera.position.set(1*cs,0.9,1*cs);
camera.lookAt(1*cs,0.9,2*cs);

// controls
let mv={x:0,y:0}, rot=0, lid=null;
const joy=document.getElementById('joy');
document.getElementById('left').addEventListener('touchstart',e=>{ const t=e.touches[0]; lid=t.identifier; joy.style.display='block'; joy.style.left=(t.clientX-28)+'px'; joy.style.top=(t.clientY-28)+'px'; },{passive:false});
document.getElementById('left').addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.touches) if(t.identifier===lid){ mv.x=(t.clientX-parseInt(joy.style.left)-28)/28; mv.y=(t.clientY-parseInt(joy.style.top)-28)/28; } },{passive:false});
document.getElementById('left').addEventListener('touchend',()=>{lid=null;mv.x=mv.y=0;joy.style.display='none';});
document.getElementById('right').addEventListener('touchmove',e=>{ rot=(e.touches[0].clientX-(window._lx||e.touches[0].clientX))*0.008; window._lx=e.touches[0].clientX; },{passive:false});
document.getElementById('right').addEventListener('touchend',()=>{rot=0;window._lx=null;});

let start=performance.now();
function loop(){
  requestAnimationFrame(loop);
  camera.rotation.y += rot; rot*=0.8;
  if(mv.x||mv.y){ const dir=new T.Vector3(mv.x,0,mv.y).normalize().applyQuaternion(camera.quaternion); dir.y=0; camera.position.addScaledVector(dir,0.06); }
  const e=Math.floor((performance.now()-start)/1000);
  document.getElementById('timer').textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');
  goal.rotation.y+=0.02;
  renderer.render(scene,camera);
}
loop();

window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

// buttons
let theme=0; const colors=[0x888888,0x4a5af9,0x3a5f2b,0xaa6633];
document.getElementById('thm').onclick=()=>{ theme=(theme+1)%colors.length; mat.color.setHex(colors[theme]); };
document.getElementById('rst').onclick=()=>{ camera.position.set(1*cs,0.9,1*cs); camera.lookAt(1*cs,0.9,2*cs); start=performance.now(); };
let lightOn=false;
document.getElementById('lit').onclick=()=>{ lightOn=!lightOn; scene.background = new T.Color(lightOn?0x000000:0x202030); };

}catch(err){
  document.getElementById('err').style.display='flex';
  document.getElementById('err').innerText='Error: '+err.message+'\nCoba update Chrome';
}
</script>
</body>
</html>
