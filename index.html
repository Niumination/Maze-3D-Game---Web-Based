<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D Maze Ultimate</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;touch-action:none}
  canvas{display:block}
  #c{position:fixed;top:0;left:0;width:100%;height:100%}
  #ui{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:10}
  #topbar{position:absolute;top:1.5vh;left:2vw;right:2vw;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
  #timer{font-size:clamp(12px,3.2vw,18px);color:#fff;text-shadow:0 0 3px #000;font-weight:600;background:rgba(0,0,0,0.4);padding:0.6vh 1.8vw;border-radius:1vw}
  #level{font-size:clamp(11px,2.6vw,16px);color:#0f0;text-shadow:0 0 2px #000;background:rgba(0,0,0,0.4);padding:0.5vh 1.5vw;border-radius:1vw}
  #leftPanel{position:absolute;left:2vw;top:8vh;pointer-events:none}
  #map{width:clamp(80px,16vmin,120px);height:clamp(80px,16vmin,120px);background:rgba(0,0,0,0.55);border:1.5px solid rgba(255,255,255,0.7);border-radius:1.2vw;display:block}
  #rightPanel{position:absolute;right:2vw;top:8vh;display:flex;flex-direction:column;gap:1.2vh;pointer-events:auto}
  #rightPanel button{width:clamp(36px,7.5vw,48px);height:clamp(36px,7.5vw,48px);font-size:clamp(16px,3.5vw,20px);background:rgba(0,0,0,0.55);color:#fff;border:1.2px solid rgba(255,255,255,0.7);border-radius:50%;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:0}
  #rightPanel button:active{transform:scale(0.92)}
  #leftZone,#rightZone{position:fixed;top:0;bottom:0;width:50vw;z-index:5}
  #leftZone{left:0} #rightZone{right:0}
  #joy{position:absolute;width:14vw;height:14vw;max-width:70px;max-height:70px;border:1.5px solid rgba(255,255,255,0.25);border-radius:50%;left:12vw;bottom:12vw;display:none;pointer-events:none}
  #joy::after{content:'';position:absolute;width:6vw;height:6vw;max-width:30px;max-height:30px;background:rgba(255,255,255,0.4);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
  #win{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:20;text-align:center;padding:5vw}
  #win h1{font-size:clamp(28px,7vw,42px);margin:0} #win p{font-size:clamp(14px,3.8vw,20px);margin:1.2vh} #win button{font-size:clamp(14px,4vw,18px);padding:1.8vh 5vw;margin-top:2vh;background:#0f0;color:#000;border:none;border-radius:1.5vw;font-weight:700}
  #board{font-size:clamp(11px,3vw,15px);opacity:0.85;margin-top:1.5vh;white-space:pre-line;line-height:1.4}
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="topbar">
    <div id="timer">00:00</div>
    <div id="level">Level 1</div>
  </div>
  <div id="leftPanel">
    <canvas id="map" width="128" height="128"></canvas>
  </div>
  <div id="rightPanel">
    <button id="restart" title="Restart">🔄</button>
    <button id="flash" title="Senter">🔦</button>
    <button id="music" title="Musik">🎵</button>
    <button id="skin" title="Tema Dinding">🎨</button>
    <button id="scale" title="Zoom">🔍</button>
  </div>
</div>
<div id="leftZone"><div id="joy"></div></div>
<div id="rightZone"></div>
<div id="win">
  <h1>SELESAI!</h1>
  <p id="finalTime"></p>
  <p id="nextInfo"></p>
  <div id="board"></div>
  <button id="again">Lanjut</button>
</div>

<script type="module">
import * as THREE from 'three';

const LEVELS = [
  {size:11, name:'Mudah'},
  {size:15, name:'Sedang'},
  {size:19, name:'Sulit'},
  {size:23, name:'Ekstrem'}
];
const THEMES = [
  {name:'Hutan', type:'forest'},
  {name:'Kota', type:'city'},
  {name:'Dungeon', type:'stone'},
  {name:'Neon', type:'neon'},
  {name:'Gurun', type:'sand'}
];
let themeIdx = 0;
const SCALES = [60,70,80,90,100];
let scaleIdx = 2;
let currentLevel = parseInt(localStorage.getItem('mazeLevel')||'0');

let scene, camera, renderer, walls=[], wallInstanced, goalMesh, flashlight, hemi, dirLight;
let movingObs=[], holes=[];
let clock = new THREE.Clock();
let startTime=0, paused=false, finished=false;
const cellSize=2;
let grid, startPos, endPos, mazeSize;
let move={x:0,y:0}, rotDelta=0, leftId=null, rightId=null, lastTouch=0;
const joy=document.getElementById('joy');
const mapCtx=document.getElementById('map').getContext('2d');

// AUDIO
let audioCtx, musicOn=false, musicNodes=[];
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function beep(f=440,d=0.05,v=0.05){initAudio(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='square'; o.frequency.value=f; g.gain.value=v; o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d);}
function winSound(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.12,0.08),i*120));}
function toggleMusic(){
  initAudio(); musicOn=!musicOn;
  document.getElementById('music').style.opacity = musicOn?1:0.5;
  if(musicOn){
    const seq=[330,0,392,0,440,0,523,0]; let step=0;
    const play=()=>{ if(!musicOn) return; const f=seq[step%seq.length]; if(f) beep(f,0.1,0.03); step++; setTimeout(play,220); };
    play();
  }
}


function createWallTexture(theme){
  const c=document.createElement('canvas'); c.width=256; c.height=256; const ctx=c.getContext('2d');
  if(theme==='forest'){
    ctx.fillStyle='#3a5f2b'; ctx.fillRect(0,0,256,256);
    ctx.strokeStyle='#2d4a22'; ctx.lineWidth=4;
    for(let i=0;i<12;i++){ ctx.beginPath(); ctx.moveTo(0,i*22); ctx.lineTo(256,i*22+10); ctx.stroke(); }
    ctx.fillStyle='#5a7f3b'; for(let i=0;i<80;i++){ ctx.fillRect(Math.random()*256,Math.random()*256,3,8); }
  } else if(theme==='city'){
    ctx.fillStyle='#6a6e73'; ctx.fillRect(0,0,256,256);
    ctx.fillStyle='#4a4e53'; for(let y=0;y<256;y+=32){ for(let x=0;x<256;x+=32){ ctx.fillRect(x+4,y+4,24,24); ctx.fillStyle='#2a2e33'; ctx.fillRect(x+8,y+8,6,8); ctx.fillRect(x+18,y+8,6,8); ctx.fillStyle='#4a4e53'; } }
    ctx.strokeStyle='#3a3e43'; ctx.lineWidth=2; ctx.strokeRect(0,0,256,256);
  } else if(theme==='stone'){
    ctx.fillStyle='#5a5a5a'; ctx.fillRect(0,0,256,256);
    for(let i=0;i<200;i++){ const g=60+Math.random()*40; ctx.fillStyle=`rgb(${g},${g},${g})`; ctx.fillRect(Math.random()*256,Math.random()*256,Math.random()*30,Math.random()*20); }
    ctx.strokeStyle='#3a3a3a'; for(let i=0;i<8;i++){ ctx.beginPath(); ctx.moveTo(0,Math.random()*256); ctx.lineTo(256,Math.random()*256); ctx.stroke(); }
  } else if(theme==='neon'){
    ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,256,256);
    ctx.strokeStyle='#4a5af9'; ctx.lineWidth=3; ctx.shadowColor='#4a5af9'; ctx.shadowBlur=10;
    for(let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(0,i*43); ctx.lineTo(256,i*43); ctx.stroke(); ctx.beginPath(); ctx.moveTo(i*43,0); ctx.lineTo(i*43,256); ctx.stroke(); }
  } else { // sand
    ctx.fillStyle='#c2a87a'; ctx.fillRect(0,0,256,256);
    for(let i=0;i<300;i++){ ctx.fillStyle=`rgba(${180+Math.random()*40},${150+Math.random()*30},${90+Math.random()*20},0.6)`; ctx.fillRect(Math.random()*256,Math.random()*256,2,2); }
  }
  const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(1,1); return tex;
}

function init(){
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x050508); scene.fog=new THREE.Fog(0x050508,8,22);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,100);
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:false,powerPreference:'low-power'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5)); renderer.setSize(window.innerWidth, window.innerHeight);

  hemi=new THREE.HemisphereLight(0xffffff,0x111122,0.9); scene.add(hemi);
  dirLight=new THREE.DirectionalLight(0xffffff,0.4); dirLight.position.set(5,8,3); scene.add(dirLight);
  flashlight=new THREE.SpotLight(0xffffff,0,18,Math.PI/4.5,0.6,1.5); 
  flashlight.position.set(0,-0.05,0.1); 
  flashlight.target = new THREE.Object3D();
  flashlight.target.position.set(0,0,-1);
  camera.add(flashlight);
  camera.add(flashlight.target);
  scene.add(camera);
  camera.fov=SCALES[scaleIdx]; camera.updateProjectionMatrix();

  loadLevel(); handleControls(); startTime=performance.now(); gameLoop();
  document.addEventListener('visibilitychange',()=>{paused=document.hidden;});
  function onResize(){
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  onResize();
  document.getElementById('restart').onclick=()=>{beep(200); loadLevel();};
  document.getElementById('again').onclick=nextLevel;
  document.getElementById('flash').onclick=toggleFlash;
  document.getElementById('music').onclick=toggleMusic;
  document.getElementById('skin').onclick=changeTheme;
  document.getElementById('scale').onclick=changeScale;
}

let flashOn=false;
function toggleFlash(){
  flashOn=!flashOn; beep(flashOn?800:400);
  document.getElementById('flash').style.opacity=flashOn?1:0.5;
  if(flashOn){ hemi.intensity=0.2; dirLight.intensity=0.05; flashlight.intensity=2.5; scene.fog.near=2; scene.fog.far=9; scene.background.set(0x000000); }
  else { hemi.intensity=0.9; dirLight.intensity=0.4; flashlight.intensity=0; scene.fog.near=8; scene.fog.far=22; scene.background.set(0x050508); }
}
function changeTheme(){ themeIdx=(themeIdx+1)%THEMES.length; const t=THEMES[themeIdx]; if(wallInstanced){ const tex=createWallTexture(t.type); wallInstanced.material.map=tex; wallInstanced.material.needsUpdate=true; } beep(600+themeIdx*40); localStorage.setItem('mazeTheme',themeIdx); showToast(t.name); }
function showToast(txt){ const el=document.getElementById('level'); const old=el.textContent; el.textContent='Tema: '+txt; el.style.color='#ff0'; setTimeout(()=>{el.textContent=old; el.style.color='#0f0';},900); }
function changeScale(){ scaleIdx=(scaleIdx+1)%SCALES.length; camera.fov=SCALES[scaleIdx]; camera.updateProjectionMatrix(); beep(400+scaleIdx*80); localStorage.setItem('mazeScale',scaleIdx); document.getElementById('scale').textContent=['🔍','🔎','👁️','👀','🔭'][scaleIdx]; }

function loadLevel(){
  walls.forEach(w=>scene.remove(w)); walls=[]; if(wallInstanced) scene.remove(wallInstanced); if(goalMesh) scene.remove(goalMesh);
  mazeSize=LEVELS[currentLevel].size;
  document.getElementById('level').textContent=`Level ${currentLevel+1} - ${LEVELS[currentLevel].name}`;
  const data=generateMaze(mazeSize); grid=data.grid; startPos=data.start; endPos=data.end;
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(mazeSize*cellSize,mazeSize*cellSize), new THREE.MeshLambertMaterial({color:0x101025})); floor.rotation.x=-Math.PI/2; scene.add(floor);
  // RINTANGAN LANTAI
  const obstacleGeo=new THREE.BoxGeometry(0.6,0.25,0.6);
  const obstacleMat=new THREE.MeshLambertMaterial({color:0x222222});
  let obsCount=0;
  for(let z=1;z<mazeSize-1;z++) for(let x=1;x<mazeSize-1;x++){
    if(grid[z][x]===0 && !(x===startPos.x&&z===startPos.z) && !(x===endPos.x&&z===endPos.z) && Math.random()<0.08 && obsCount<Math.floor(mazeSize*1.5)){
      const obs=new THREE.Mesh(obstacleGeo, obstacleMat);
      obs.position.set(x*cellSize,0.125,z*cellSize);
      scene.add(obs); walls.push(obs); obsCount++;
    }
  }
  // RINTANGAN BERGERAK PATROLI
  movingObs=[]; 
  const patrolMat=new THREE.MeshLambertMaterial({color:0xff3333, emissive:0x440000});
  for(let i=0;i<3;i++){
    let tries=0; while(tries<50){
      const x=2+Math.floor(Math.random()*(mazeSize-4));
      const z=2+Math.floor(Math.random()*(mazeSize-4));
      if(grid[z][x]===0 && grid[z][x+1]===0){
        const mob=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.5,0.8), patrolMat);
        mob.position.set(x*cellSize,0.25,z*cellSize);
        mob.userData={ax:x*cellSize, az:z*cellSize, bx:(x+1)*cellSize, bz:z*cellSize, t:Math.random(), dir:1};
        scene.add(mob); walls.push(mob); movingObs.push(mob); break;
      }
      tries++;
    }
  }
  // LUBANG JATUH
  holes=[];
  const holeMat=new THREE.MeshBasicMaterial({color:0x000000});
  for(let i=0;i<Math.floor(mazeSize/3);i++){
    let tries=0; while(tries<30){
      const x=2+Math.floor(Math.random()*(mazeSize-4));
      const z=2+Math.floor(Math.random()*(mazeSize-4));
      if(grid[z][x]===0 && !(x===startPos.x&&z===startPos.z) && Math.hypot(x-endPos.x,z-endPos.z)>3){
        const hole=new THREE.Mesh(new THREE.CircleGeometry(0.7,16), holeMat);
        hole.rotation.x=-Math.PI/2; hole.position.set(x*cellSize,0.02,z*cellSize);
        scene.add(hole); holes.push(hole); break;
      }
      tries++;
    }
  }

  const wallPos=[]; for(let z=0;z<mazeSize;z++) for(let x=0;x<mazeSize;x++) if(grid[z][x]) wallPos.push([x,z]);
  const geo=new THREE.BoxGeometry(cellSize,1.4,cellSize); const t=THEMES[themeIdx]; const tex=createWallTexture(t.type); const mat=new THREE.MeshLambertMaterial({map:tex});
  wallInstanced=new THREE.InstancedMesh(geo,mat,wallPos.length); const dummy=new THREE.Object3D();
  wallPos.forEach((p,i)=>{ dummy.position.set(p[0]*cellSize,0.7,p[1]*cellSize); dummy.updateMatrix(); wallInstanced.setMatrixAt(i,dummy.matrix); const w=new THREE.Mesh(new THREE.BoxGeometry(cellSize,1.4,cellSize)); w.position.copy(dummy.position); w.visible=false; walls.push(w); scene.add(w); });
  scene.add(wallInstanced);
  goalMesh=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9), new THREE.MeshLambertMaterial({color:0x00ff88,emissive:0x00aa55})); goalMesh.position.set(endPos.x*cellSize,0.45,endPos.z*cellSize); scene.add(goalMesh);
  camera.position.set(startPos.x*cellSize,0.8,startPos.z*cellSize);
  // langsung menghadap ke depan (arah +Z)
  camera.lookAt(startPos.x*cellSize, 0.8, startPos.z*cellSize + 2);
  finished=false; startTime=performance.now(); document.getElementById('win').style.display='none'; drawMinimap();
}

function generateMaze(size){ const g=Array(size).fill().map(()=>Array(size).fill(1)); function carve(x,z){ g[z][x]=0; const dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5); for(const [dx,dz] of dirs){ const nx=x+dx,nz=z+dz; if(nx>0&&nx<size-1&&nz>0&&nz<size-1&&g[nz][nx]===1){ g[z+dz/2][x+dx/2]=0; carve(nx,nz);} } } carve(1,1); return {grid:g,start:{x:1,z:1},end:{x:size-2,z:size-2}}; }

function handleControls(){
  const left=document.getElementById('leftZone'), right=document.getElementById('rightZone');
  const vib=()=>{if(navigator.vibrate)navigator.vibrate(8);};
  left.addEventListener('touchstart',e=>{initAudio();vib(); const t=e.changedTouches[0]; leftId=t.identifier; joy.style.display='block'; joy.style.left=(t.clientX-9*innerWidth/100)+'px'; joy.style.top=(t.clientY-9*innerWidth/100)+'px';},{passive:false});
  left.addEventListener('touchmove',e=>{ const now=performance.now(); if(now-lastTouch<20)return; lastTouch=now; for(const t of e.touches) if(t.identifier===leftId){ const dx=(t.clientX-parseFloat(joy.style.left)-9*innerWidth/100)/(9*innerWidth/100); const dy=(t.clientY-parseFloat(joy.style.top)-9*innerWidth/100)/(9*innerWidth/100); move.x=Math.max(-1,Math.min(1,dx)); move.y=Math.max(-1,Math.min(1,dy)); } },{passive:false});
  left.addEventListener('touchend',()=>{leftId=null;move.x=0;move.y=0;joy.style.display='none';});
  right.addEventListener('touchstart',e=>{vib(); rightId=e.changedTouches[0].identifier;},{passive:false});
  right.addEventListener('touchmove',e=>{ for(const t of e.touches) if(t.identifier===rightId){rotDelta=t.clientX-(right._lastX||t.clientX); right._lastX=t.clientX;} },{passive:false});
  right.addEventListener('touchend',()=>{rightId=null;rotDelta=0;right._lastX=null;});
}

function drawMinimap(){ const s=128/mazeSize; mapCtx.fillStyle='#000'; mapCtx.fillRect(0,0,128,128); for(let z=0;z<mazeSize;z++) for(let x=0;x<mazeSize;x++){ const themeColors={forest:'#3a5f2b',city:'#6a6e73',stone:'#5a5a5a',neon:'#4a5af9',sand:'#c2a87a'}; mapCtx.fillStyle=grid[z][x]?themeColors[THEMES[themeIdx].type]:'#111'; mapCtx.fillRect(x*s,z*s,s,s);} mapCtx.fillStyle='#00ff88'; mapCtx.fillRect(endPos.x*s,endPos.z*s,s,s); }

const ray=new THREE.Raycaster(); let stepTimer=0;
function gameLoop(){ requestAnimationFrame(gameLoop); if(paused||finished) return; const delta=Math.min(clock.getDelta(),0.05); camera.rotation.y += rotDelta*0.005; rotDelta *= 0.8; // swipe kanan = belok kanan
  if(move.x||move.y){ const fwd=new THREE.Vector3(move.x,0,move.y).normalize().applyQuaternion(camera.quaternion); fwd.y=0; ray.set(camera.position,fwd); ray.far=0.65; const hit=ray.intersectObjects(walls); if(!hit.length){ camera.position.addScaledVector(fwd,2.2*delta); stepTimer+=delta; if(stepTimer>0.35){beep(300+Math.random()*50,0.02,0.02); stepTimer=0;} } else beep(150,0.03,0.03); }
  const elapsed=Math.floor((performance.now()-startTime)/1000); document.getElementById('timer').textContent=`${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`;
  const px=camera.position.x/cellSize, pz=camera.position.z/cellSize; drawMinimap(); const s=128/mazeSize; mapCtx.fillStyle='#fff'; mapCtx.beginPath(); mapCtx.arc(px*s+s/2,pz*s+s/2,3,0,Math.PI*2); mapCtx.fill();
  if(camera.position.distanceTo(goalMesh.position)<1.1 && !finished){ finished=true; winSound(); if(navigator.vibrate)navigator.vibrate([40,30,40,30,80]); const timeStr=document.getElementById('timer').textContent; document.getElementById('finalTime').textContent=`Waktu: ${timeStr}`; saveBest(elapsed); document.getElementById('nextInfo').textContent=currentLevel<LEVELS.length-1?`Lanjut ke ${LEVELS[currentLevel+1].name}`:'Kamu tamatkan semua!'; document.getElementById('board').textContent=getBoardText(); document.getElementById('win').style.display='flex'; }
  // update patroli
  movingObs.forEach(m=>{
    m.userData.t += delta*0.6*m.userData.dir;
    if(m.userData.t>1){m.userData.t=1; m.userData.dir=-1;}
    if(m.userData.t<0){m.userData.t=0; m.userData.dir=1;}
    const t=m.userData.t;
    m.position.x = m.userData.ax*(1-t) + m.userData.bx*t;
    m.position.z = m.userData.az*(1-t) + m.userData.bz*t;
    m.rotation.y += delta*2;
  });
  // cek lubang
  for(const h of holes){
    if(camera.position.distanceTo(h.position)<0.6){
      if(!window._falling){ window._falling=true; beep(120,0.3,0.1); if(navigator.vibrate) navigator.vibrate([100,50,100]); setTimeout(()=>{ camera.position.set(startPos.x*cellSize,0.8,startPos.z*cellSize); camera.lookAt(startPos.x*cellSize,0.8,startPos.z*cellSize+2); window._falling=false; },400); }
      break;
    }
  }
  goalMesh.rotation.y+=delta*1.5; goalMesh.position.y=0.45+Math.sin(performance.now()*0.003)*0.1; renderer.render(scene,camera);
}

function saveBest(sec){ const key='mazeBest'; const data=JSON.parse(localStorage.getItem(key)||'{}'); const lvl=LEVELS[currentLevel].name; if(!data[lvl]||sec<data[lvl]) data[lvl]=sec; localStorage.setItem(key,JSON.stringify(data)); localStorage.setItem('mazeLevel',currentLevel); }
function getBoardText(){ const data=JSON.parse(localStorage.getItem('mazeBest')||'{}'); let txt='🏆 Waktu Terbaik:\n'; LEVELS.forEach(l=>{ if(data[l.name]){ const s=data[l.name]; txt+=`${l.name}: ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}\n`; } }); return txt; }
function nextLevel(){ currentLevel=(currentLevel+1)%LEVELS.length; localStorage.setItem('mazeLevel',currentLevel); loadLevel(); }

themeIdx=parseInt(localStorage.getItem('mazeTheme')||'0');
scaleIdx=parseInt(localStorage.getItem('mazeScale')||'2');
document.getElementById('scale').textContent=['🔍','🔎','👁️','👀','🔭'][scaleIdx];
init();
</script>
</body>
</html>
