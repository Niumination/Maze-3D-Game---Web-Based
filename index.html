<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D Maze Mobile</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
  #c{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
  #ui{position:fixed;top:0;left:0;right:0;z-index:10;pointer-events:none}
  #topbar{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between}
  #timer,#level{background:rgba(0,0,0,0.5);color:#fff;padding:4px 10px;border-radius:8px;font-size:14px;font-weight:600;text-shadow:0 1px 2px #000}
  #level{color:#0f0}
  #leftPanel{position:absolute;left:8px;top:50px}
  #map{width:90px;height:90px;background:rgba(0,0,0,0.6);border:1px solid #fff;border-radius:6px}
  #rightPanel{position:absolute;right:8px;top:50px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
  #rightPanel button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,0.7);background:rgba(0,0,0,0.55);color:#fff;font-size:20px}
  #leftZone,#rightZone{position:fixed;top:0;bottom:0;width:50%;z-index:5}
  #leftZone{left:0} #rightZone{right:0}
  #joy{position:absolute;width:60px;height:60px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;display:none;left:40px;bottom:80px}
  #joy::after{content:'';position:absolute;width:26px;height:26px;background:rgba(255,255,255,0.5);border-radius:50%;left:17px;top:17px}
  #win{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:20;text-align:center;padding:20px}
  #win h1{font-size:32px;margin:0 0 10px} #win p{margin:6px;font-size:16px}
  #win button{margin-top:15px;padding:10px 24px;font-size:16px;background:#0f0;color:#000;border:none;border-radius:8px;font-weight:700}
  #board{font-size:13px;opacity:0.85;white-space:pre-line;margin-top:10px}
  #fallback{position:fixed;inset:0;background:#000;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:100}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fallback">Browser kamu tidak support WebGL.<br>Coba update Chrome.</div>

<div id="ui">
  <div id="topbar"><div id="timer">00:00</div><div id="level">Level 1</div></div>
  <div id="leftPanel"><canvas id="map" width="128" height="128"></canvas></div>
  <div id="rightPanel">
    <button id="restart" title="Restart">🔄</button>
    <button id="flash" title="Senter">🔦</button>
    <button id="music" title="Musik">🎵</button>
    <button id="skin" title="Tema">🎨</button>
    <button id="scale" title="Zoom">🔍</button>
  </div>
</div>

<div id="leftZone"><div id="joy"></div></div>
<div id="rightZone"></div>

<div id="win">
  <h1>SELESAI!</h1>
  <p id="finalTime"></p>
  <p id="nextInfo"></p>
  <div id="board"></div>
  <button id="again">Lanjut</button>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// ===== 3D MAZE - VERSI CLEAN MOBILE =====
(function(){
'use strict';

if(!window.THREE || !window.WebGLRenderingContext){
  document.getElementById('fallback').style.display='flex';
  return;
}

const LEVELS = [
  {size:11, name:'Mudah'},
  {size:15, name:'Sedang'},
  {size:19, name:'Sulit'}
];
const THEMES = [
  {name:'Hutan', type:'forest', color:'#3a5f2b'},
  {name:'Kota', type:'city', color:'#6a6e73'},
  {name:'Dungeon', type:'stone', color:'#5a5a5a'},
  {name:'Neon', type:'neon', color:'#4a5af9'},
  {name:'Gurun', type:'sand', color:'#c2a87a'}
];
const SCALES = [60,70,80,90];

let scene, camera, renderer, walls=[], wallMesh, goal, hemi, dirLight, flashlight;
let movingObs=[], holes=[];
let clock = new THREE.Clock();
let startTime=0, finished=false, paused=false;
let grid, startPos, endPos, mazeSize=15, cellSize=2;
let move={x:0,y:0}, rotDelta=0, leftId=null, rightId=null;
let themeIdx = parseInt(localStorage.getItem('mazeTheme')||'0');
let levelIdx = parseInt(localStorage.getItem('mazeLevel')||'0');
let scaleIdx = parseInt(localStorage.getItem('mazeScale')||'1');
let musicOn=false, audioCtx;

const timerEl=document.getElementById('timer');
const levelEl=document.getElementById('level');
const mapCanvas=document.getElementById('map');
const mapCtx=mapCanvas.getContext('2d');
const joyEl=document.getElementById('joy');

// Audio sederhana
function beep(f,d,v){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type='square'; o.frequency.value=f; g.gain.value=v||0.05; o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d); }catch(e){} }

// Buat texture dinding
function makeTexture(type){
  const c=document.createElement('canvas'); c.width=128; c.height=128; const x=c.getContext('2d');
  if(type==='forest'){ x.fillStyle='#3a5f2b'; x.fillRect(0,0,128,128); x.strokeStyle='#2d4a22'; for(let i=0;i<8;i++){x.beginPath();x.moveTo(0,i*16);x.lineTo(128,i*16+5);x.stroke();} }
  else if(type==='city'){ x.fillStyle='#6a6e73'; x.fillRect(0,0,128,128); x.fillStyle='#4a4e53'; for(let y=0;y<128;y+=32){for(let a=0;a<128;a+=32){x.fillRect(a+2,y+2,28,28);}} }
  else if(type==='stone'){ x.fillStyle='#5a5a5a'; x.fillRect(0,0,128,128); for(let i=0;i<80;i++){x.fillStyle='rgb('+(50+Math.random()*30)+','+(50+Math.random()*30)+','+(50+Math.random()*30)+')'; x.fillRect(Math.random()*128,Math.random()*128,10+Math.random()*15,6+Math.random()*10);} }
  else if(type==='neon'){ x.fillStyle='#0a0a1a'; x.fillRect(0,0,128,128); x.strokeStyle='#4a5af9'; x.lineWidth=2; for(let i=0;i<5;i++){x.beginPath();x.moveTo(0,i*26);x.lineTo(128,i*26);x.stroke();} }
  else { x.fillStyle='#c2a87a'; x.fillRect(0,0,128,128); }
  const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; return tex;
}

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x050508);
  scene.fog=new THREE.Fog(0x050508, 6, 18);
  
  camera=new THREE.PerspectiveCamera(SCALES[scaleIdx], window.innerWidth/window.innerHeight, 0.1, 50);
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:false, powerPreference:'low-power'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  
  hemi=new THREE.HemisphereLight(0xffffff,0x222244,0.8); scene.add(hemi);
  dirLight=new THREE.DirectionalLight(0xffffff,0.3); dirLight.position.set(3,5,2); scene.add(dirLight);
  
  flashlight=new THREE.SpotLight(0xffffff,0,12,Math.PI/4,0.5); 
  flashlight.position.set(0,0.1,0.2);
  camera.add(flashlight);
  const target=new THREE.Object3D(); target.position.set(0,0,-1); camera.add(target); flashlight.target=target;
  scene.add(camera);
  
  setupLevel();
  setupControls();
  setupUI();
  animate();
  
  window.addEventListener('resize',onResize);
  window.addEventListener('orientationchange',()=>setTimeout(onResize,200));
}

function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function generateMaze(size){
  const g=Array(size).fill().map(()=>Array(size).fill(1));
  function carve(x,z){ g[z][x]=0; [[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5).forEach(([dx,dz])=>{ const nx=x+dx,nz=z+dz; if(nx>0&&nx<size-1&&nz>0&&nz<size-1&&g[nz][nx]){ g[z+dz/2][x+dx/2]=0; carve(nx,nz);} }); }
  carve(1,1); return {grid:g,start:{x:1,z:1},end:{x:size-2,z:size-2}};
}

function setupLevel(){
  // clear
  walls.forEach(w=>scene.remove(w)); walls=[]; movingObs=[]; holes=[];
  if(wallMesh) scene.remove(wallMesh); if(goal) scene.remove(goal);
  
  mazeSize=LEVELS[levelIdx].size;
  levelEl.textContent='Lv'+(levelIdx+1)+' '+LEVELS[levelIdx].name;
  
  const data=generateMaze(mazeSize); grid=data.grid; startPos=data.start; endPos=data.end;
  
  // floor
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(mazeSize*cellSize,mazeSize*cellSize), new THREE.MeshLambertMaterial({color:0x111122}));
  floor.rotation.x=-Math.PI/2; scene.add(floor);
  
  // walls
  const positions=[];
  for(let z=0;z<mazeSize;z++) for(let x=0;x<mazeSize;x++) if(grid[z][x]) positions.push([x,z]);
  const geo=new THREE.BoxGeometry(cellSize,1.3,cellSize);
  const mat=new THREE.MeshLambertMaterial({map:makeTexture(THEMES[themeIdx].type)});
  wallMesh=new THREE.InstancedMesh(geo, mat, positions.length);
  const dummy=new THREE.Object3D();
  positions.forEach((p,i)=>{ dummy.position.set(p[0]*cellSize,0.65,p[1]*cellSize); dummy.updateMatrix(); wallMesh.setMatrixAt(i,dummy.matrix); const col=new THREE.Mesh(new THREE.BoxGeometry(cellSize,1.3,cellSize)); col.position.copy(dummy.position); col.visible=false; scene.add(col); walls.push(col); });
  scene.add(wallMesh);
  
  // obstacles kecil
  for(let i=0;i<mazeSize;i++){ const x=1+Math.floor(Math.random()*(mazeSize-2)), z=1+Math.floor(Math.random()*(mazeSize-2)); if(grid[z][x]===0){ const o=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.2,0.5), new THREE.MeshLambertMaterial({color:0x222222})); o.position.set(x*cellSize,0.1,z*cellSize); scene.add(o); walls.push(o);} }
  
  // patroli
  for(let i=0;i<2;i++){ const x=2+Math.floor(Math.random()*(mazeSize-4)), z=2+Math.floor(Math.random()*(mazeSize-4)); if(grid[z][x]===0){ const m=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.4,0.7), new THREE.MeshLambertMaterial({color:0xff3333})); m.position.set(x*cellSize,0.2,z*cellSize); m.userData={a:x, b:x+1, z:z, t:0, d:1}; scene.add(m); walls.push(m); movingObs.push(m);} }
  
  // lubang
  for(let i=0;i<3;i++){ const x=2+Math.floor(Math.random()*(mazeSize-4)), z=2+Math.floor(Math.random()*(mazeSize-4)); if(grid[z][x]===0){ const h=new THREE.Mesh(new THREE.CircleGeometry(0.6,12), new THREE.MeshBasicMaterial({color:0x000000})); h.rotation.x=-Math.PI/2; h.position.set(x*cellSize,0.01,z*cellSize); scene.add(h); holes.push(h);} }
  
  // goal
  goal=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.8,0.8), new THREE.MeshLambertMaterial({color:0x00ff88}));
  goal.position.set(endPos.x*cellSize,0.4,endPos.z*cellSize); scene.add(goal);
  
  // player start
  camera.position.set(startPos.x*cellSize,0.8,startPos.z*cellSize);
  camera.lookAt(startPos.x*cellSize,0.8,startPos.z*cellSize+1);
  
  startTime=performance.now(); finished=false;
  drawMap();
}

function setupControls(){
  const left=document.getElementById('leftZone'), right=document.getElementById('rightZone');
  left.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; leftId=t.identifier; joyEl.style.display='block'; joyEl.style.left=(t.clientX-30)+'px'; joyEl.style.top=(t.clientY-30)+'px'; beep(300,0.02,0.02); },{passive:false});
  left.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.touches) if(t.identifier===leftId){ const dx=(t.clientX-parseInt(joyEl.style.left)-30)/30; const dy=(t.clientY-parseInt(joyEl.style.top)-30)/30; move.x=Math.max(-1,Math.min(1,dx)); move.y=Math.max(-1,Math.min(1,dy)); } },{passive:false});
  left.addEventListener('touchend',e=>{ leftId=null; move.x=0; move.y=0; joyEl.style.display='none'; });
  
  right.addEventListener('touchstart',e=>{ e.preventDefault(); rightId=e.changedTouches[0].identifier; },{passive:false});
  right.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.touches) if(t.identifier===rightId){ rotDelta = (t.clientX - (right.lastX||t.clientX)) * 0.005; right.lastX=t.clientX; } },{passive:false});
  right.addEventListener('touchend',()=>{ rightId=null; rotDelta=0; right.lastX=null; });
}

function setupUI(){
  document.getElementById('restart').onclick=()=>{ beep(200,0.05); setupLevel(); };
  document.getElementById('flash').onclick=()=>{ const on=flashlight.intensity===0; flashlight.intensity=on?1.5:0; hemi.intensity=on?0.3:0.8; beep(on?800:400,0.05); };
  document.getElementById('music').onclick=()=>{ musicOn=!musicOn; beep(600,0.05); };
  document.getElementById('skin').onclick=()=>{ themeIdx=(themeIdx+1)%THEMES.length; localStorage.setItem('mazeTheme',themeIdx); wallMesh.material.map=makeTexture(THEMES[themeIdx].type); wallMesh.material.needsUpdate=true; beep(500+themeIdx*50,0.05); drawMap(); };
  document.getElementById('scale').onclick=()=>{ scaleIdx=(scaleIdx+1)%SCALES.length; camera.fov=SCALES[scaleIdx]; camera.updateProjectionMatrix(); localStorage.setItem('mazeScale',scaleIdx); beep(400,0.05); };
  document.getElementById('again').onclick=()=>{ levelIdx=(levelIdx+1)%LEVELS.length; localStorage.setItem('mazeLevel',levelIdx); document.getElementById('win').style.display='none'; setupLevel(); };
}

function drawMap(){
  const s=mapCanvas.width/mazeSize; mapCtx.fillStyle='#000'; mapCtx.fillRect(0,0,128,128);
  for(let z=0;z<mazeSize;z++) for(let x=0;x<mazeSize;x++){ mapCtx.fillStyle=grid[z][x]?THEMES[themeIdx].color:'#111'; mapCtx.fillRect(x*s,z*s,s,s); }
  mapCtx.fillStyle='#0f0'; mapCtx.fillRect(endPos.x*s,endPos.z*s,s,s);
}

const ray=new THREE.Raycaster();
function animate(){
  requestAnimationFrame(animate);
  const delta=Math.min(clock.getDelta(),0.05);
  
  if(!finished){
    // rotate
    camera.rotation.y += rotDelta; rotDelta*=0.85;
    
    // move
    if(move.x||move.y){
      const dir=new THREE.Vector3(move.x,0,move.y).normalize().applyQuaternion(camera.quaternion); dir.y=0;
      ray.set(camera.position, dir); ray.far=0.6;
      if(ray.intersectObjects(walls).length===0){ camera.position.addScaledVector(dir, 1.8*delta); }
    }
    
    // patroli
    movingObs.forEach(m=>{ m.userData.t+=delta*0.5*m.userData.d; if(m.userData.t>1||m.userData.t<0) m.userData.d*=-1; m.position.x=(m.userData.a*(1-m.userData.t)+m.userData.b*m.userData.t)*cellSize; });
    
    // holes
    holes.forEach(h=>{ if(camera.position.distanceTo(h.position)<0.6){ camera.position.set(startPos.x*cellSize,0.8,startPos.z*cellSize); beep(150,0.2); } });
    
    // timer
    const e=Math.floor((performance.now()-startTime)/1000); timerEl.textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');
    
    // goal
    if(camera.position.distanceTo(goal.position)<1){ finished=true; beep(800,0.2); document.getElementById('finalTime').textContent='Waktu: '+timerEl.textContent; document.getElementById('win').style.display='flex'; }
    
    goal.rotation.y+=delta;
  }
  
  renderer.render(scene,camera);
}

init();

})();
</script>
</body>
</html>
